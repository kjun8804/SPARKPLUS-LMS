name: Recover source and deploy LMS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-emergency-copy.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  recover-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest deployed application
        run: |
          curl --fail --location --silent --show-error \
            https://sparkplus-lms-prototype.min20993.chatgpt.site/assets/page-BQVpnc2q.js \
            --output /tmp/latest-page.js
          curl --fail --location --silent --show-error \
            https://sparkplus-lms-prototype.min20993.chatgpt.site/assets/index-EbbBzZq3.css \
            --output /tmp/latest-styles.css

      - name: Recover editable React source
        run: |
          python3 <<'PY'
          from pathlib import Path

          raw = Path("/tmp/latest-page.js").read_text(encoding="utf-8")
          marker = ",i=n(),a=["
          if marker not in raw:
              raise SystemExit("Unable to locate the compiled React application marker")

          body = raw.split(marker, 1)[1]
          header = '''import * as r from "react";
          import { jsx, jsxs, Fragment } from "react/jsx-runtime";

          const i = { jsx, jsxs, Fragment };
          var a=['''

          app = header + body
          app = app.replace(
              "src:`/sparkplus-logo-black.png`",
              "src:`https://sparkplus-lms-prototype.min20993.chatgpt.site/sparkplus-logo-black.png`",
          )
          Path("src/App.jsx").write_text(app, encoding="utf-8")

          css = Path("/tmp/latest-styles.css").read_text(encoding="utf-8")
          css += r'''

          /* Bright classroom and comfortable action colors */
          :root {
            --blue: #356f9f;
            --blue-dark: #28587f;
            --brand-soft: #edf4fa;
          }

          .player-page {
            background: #f3f5f7 !important;
            color: #1f2937 !important;
          }

          .player-header {
            color: #1f2937 !important;
            background: #ffffff !important;
            border-bottom: 1px solid #dce3ea !important;
          }

          .player-main {
            background: #ffffff !important;
            border: 1px solid #e0e5ea !important;
            border-radius: 14px !important;
            margin-top: 24px !important;
            margin-bottom: 40px !important;
            padding: 30px !important;
            box-shadow: 0 8px 28px rgba(37, 55, 74, 0.08) !important;
          }

          .lesson-sidebar,
          .player-tab-content,
          .player-files button {
            background: #ffffff !important;
          }

          .primary,
          .player-actions .primary,
          .player-actions .save {
            color: #ffffff !important;
            background: #356f9f !important;
            border-color: #356f9f !important;
          }

          .primary:hover,
          .player-actions .primary:hover,
          .player-actions .save:hover {
            background: #28587f !important;
            border-color: #28587f !important;
          }

          .secondary,
          .exit-classroom,
          .open-sidebar {
            color: #40566d !important;
            background: #ffffff !important;
            border-color: #c6d0da !important;
          }

          .player-tabs button.active,
          .player-head span {
            color: #356f9f !important;
            border-bottom-color: #356f9f !important;
          }

          .sidebar-lessons button.current {
            background: #edf4fa !important;
            border-left-color: #356f9f !important;
          }

          .admin-portal {
            --mint: #356f9f !important;
            --mint-dark: #28587f !important;
            --mint-light: #edf4fa !important;
          }

          .admin-portal .primary,
          .admin-portal .course-search-button {
            color: #ffffff !important;
            background: #356f9f !important;
            border-color: #356f9f !important;
          }
          '''
          Path("src/styles.css").write_text(css, encoding="utf-8")

          Path("vite.config.js").write_text(
              '''import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            plugins: [react()],
            base: "/SPARKPLUS-LMS/",
          });
          ''',
              encoding="utf-8",
          )
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build recovered source
        run: |
          npm install
          npm run build

      - name: Save recovered source to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css vite.config.js package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Recover latest editable LMS source"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
